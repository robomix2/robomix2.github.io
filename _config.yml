# --- Core ---
title: "RoboMix2 SNSF Project"
description: "TODO"
url: ""
baseurl: ""

atom_feed:
  hide: true

# --- Theme ---
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "contrast"  # options: air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise

# --- Plugins ---
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap

# --- Defaults ---
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      classes: wide
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      classes: wide

# --- Includes ---
include:
  - _pages