news:
  - date: 2026-01-31
    text: "'Tiny-DroNeRF: Tiny Neural Radiance Fields aboard Federated Learning-enabled Nano-drones', collaboration between IDSIA USI-SUPSI, University of Bologna and ETH Zurich, has been accepted to ICRA 2026"
    logo: "/assets/images/publications/icra.png"
    logo_width: "110px"
  - date: 2025-12-01
    text: "'Multi-modal On-Device Learning for Monocular Depth Estimation on Ultra-low-power MCUs', collaboration between IDSIA USI-SUPSI, UNIBO, KU Leuven and ETHZ, has been accepted for publication in the IEEE Internet of Things Journal"
    logo: "/assets/images/publications/ieee-logo-black.png"
  - date: 2026-04-10
    text: "'TinyDEVO: Deep Event-based Visual Odometry on Ultra-low-power Multi-core Microcontrollers', from ETH Zurich, has been accepted to the Embedded Vision Workshop, held in conjunction with IEEE/CVF Conference on Computer Vision and Pattern Recognition 2026 (CVPR 2026)"
    logo: "/assets/images/publications/cvpr2026.png"
  - date: 2026-06-15
    text: "'TinyDEVO: Deep Event-based Visual Odometry on Ultra-low-power Multi-core Microcontrollers' received the Best Paper Award at the Embedded Vision Workshop (EVW), in conjunction with CVPR 2026!"
    logo: "/assets/images/publications/EVW-CVPR26_best_paper.png"
    logo_width: "180px"
  - date: 2026-06-30
    text: "'Thinking Fast, Thinking Slow: Adaptive Multimodal Transformer-based Sensor Fusion for Depth Estimation on Ultra-low-power MCUs', from IDSIA, SUPSI, has been accepted for publication to IEEE Sensors Journal"
    logo: "/assets/images/publications/ieee-logo-black.png"
  - date: 2026-09-01
    text: "'NOVA: Neuromorphic Optical Flow for Event-Based Visual Odometry', from University of Bologna, has been accepted to the 'Workshop on Neuromorphic Vision' (NeVi), held in conjunction with the European Conference on Computer Vision (ECCV 2026), in Malmö, Sweden"
    logo: "/assets/images/publications/eccv.jpeg"